[project]
name = "voxitech"
version = "0.1.0"
description = "Laboratorio reproducible de análisis de discurso asistido por IA y ciencia de datos"
requires-python = ">=3.11"
authors = [
    { name = "VoxiTech Lab AI", email = "investigador@example.com" }
]
dependencies = [
    "pandas>=2.2.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.11.0",
    "langdetect>=1.0.9",
    "spacy>=3.7.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "loguru>=0.7.0",
    "typer[all]>=0.12.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "jupyter>=1.0.0",
    "streamlit>=1.30.0",
    "weasyprint>=62.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]